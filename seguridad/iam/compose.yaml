services:

  keycloak:

    image: quay.io/keycloak/keycloak:26.8.1

    container_name: vertex-keycloak

    command: start-dev

    restart: unless-stopped

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: vertexadmin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?Define KC_ADMIN_PASSWORD}

    ports:
      - "127.0.0.1:8180:8080"

    volumes:
      - keycloak_data:/opt/keycloak/data

    mem_limit: 1g

volumes:
  keycloak_data: